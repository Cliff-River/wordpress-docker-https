services:
  db:
    image: mariadb:latest
    container_name: wordpress_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress_pass}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - ./db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    build:
      context: .
      args:
        WORDPRESS_VERSION: ${WORDPRESS_VERSION:-7.1.5}
        WP_LANG: ${WP_LANG:-zh_CN}
    image: workpress-fpm:${WORDPRESS_VERSION:-7.1.5}-${WP_LANG:-zh_CN}
    container_name: wordpress_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress_pass}
      # nginx 通过 FastCGI 直连 php-fpm（9000），HTTPS 由 nginx 的
      # fastcgi_param HTTPS on 告知 PHP；此处只固定后台强制 SSL 与站点语言
      WORDPRESS_CONFIG_EXTRA: |
        define('FORCE_SSL_ADMIN', true);
        define('WPLANG', '${WP_LANG:-zh_CN}');
    volumes:
      - ./wp-data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:latest
    container_name: wordpress_nginx
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # 只读共享站点文件：nginx 直接返回静态资源，并作为 FastCGI 的 document root
      - ./wp-data:/var/www/html:ro
