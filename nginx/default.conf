# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    server_name _;

    # 放行 ACME 挑战（将来替换为正式证书时使用，自签名阶段可忽略）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 入口：静态文件由 nginx 直接返回，PHP 通过 FastCGI 交给 wordpress 容器
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自签名证书（由 generate-certs.sh 生成）
    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # 加密套件与协议（现代浏览器兼容）
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：强制浏览器后续使用 HTTPS（自签名下可按需关闭）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64m;

    # 站点根目录（只读挂载宿主机 ./wp-data，与 wordpress 容器共享同一份文件）
    root /var/www/html;
    index index.php index.html;

    # 固定链接：文件/目录存在则直接返回，否则交给 WordPress 前端控制器
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 静态资源：由 nginx 直接读盘返回并缓存，不再经过 PHP
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # PHP：交给 wordpress 容器的 php-fpm（9000）
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 本 server 只监听 443，直接告知 PHP 当前请求为 HTTPS
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300s;
    }

    # 不暴露隐藏文件（保留 ACME 校验目录）
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
